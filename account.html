<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>บัญชีของฉัน — DUDEHUM</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <style>
    .my-products { display: flex; flex-direction: column; gap: 4px; }
    .my-product { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .my-product:last-child { border-bottom: 0; }
    .my-product__thumb { width: 48px; height: 48px; border-radius: 10px; overflow: hidden; background: var(--bg-tint); display: grid; place-items: center; flex: none; }
    .my-product__thumb img { width: 100%; height: 100%; object-fit: cover; }
    .my-product__info { flex: 1; min-width: 0; }
    .my-product__info strong { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .my-product__info span { font-size: 13px; color: var(--text-soft); }
    .my-product__st { font-weight: 600; }
    .my-product__st--available { color: #0f9d58; }
    .my-product__st--reserved { color: #b07a00; }
    .my-product__st--sold { color: #6b7280; }
    .my-status { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13px; background: var(--bg); color: var(--text); cursor: pointer; flex: none; }
    .my-status:focus { outline: 0; border-color: var(--brand); }
  </style>
</head>
<body>
  <header class="site-header scrolled" id="header">
    <div class="container nav">
      <a href="index.html" class="brand">
        <img class="brand__logo" src="assets/logo.svg" alt="DH Group" />
      </a>
      <div class="nav__actions">
        <a href="shop.html" class="btn btn--ghost btn--sm">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 12.5a1 1 0 0 1-1 .9H8a1 1 0 0 1-1-.9L6 7z"/><path d="M9 7V6a3 3 0 0 1 6 0v1"/></svg>
          ไปช้อปต่อ
        </a>
        <button class="btn btn--primary btn--sm" id="logoutBtn">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h9"/></svg>
          ออกจากระบบ
        </button>
      </div>
    </div>
  </header>

  <main class="account">
    <div class="container">
      <section class="account__hero reveal visible">
        <div class="account__avatar" id="avatar">U</div>
        <div>
          <h1 class="account__hello">สวัสดี, <span id="userName">สมาชิก</span></h1>
          <p class="account__email" id="userEmail"></p>
        </div>
      </section>

      <section class="grid grid--4 stats account__stats">
        <div class="stat">
          <span class="stat__icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 17.8 6.8 20.1l1-5.8-4.3-4.1 5.9-.9z"/></svg></span>
          <span class="stat__num">1,250</span><span class="stat__label">แต้มสะสม</span>
        </div>
        <div class="stat">
          <span class="stat__icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4V7z"/><path d="M3 7l9 4 9-4"/><path d="M12 11v10"/></svg></span>
          <span class="stat__num" id="statOrders">0</span><span class="stat__label">คำสั่งซื้อ</span>
        </div>
        <div class="stat">
          <span class="stat__icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2 2 2 0 0 0 0 4 2 2 0 0 1-2 2H6a2 2 0 0 1-2-2 2 2 0 0 0 0-4z"/><path d="M12 7v10" stroke-dasharray="1.5 2.5"/></svg></span>
          <span class="stat__num">3</span><span class="stat__label">โค้ดส่วนลด</span>
        </div>
        <div class="stat">
          <span class="stat__icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8l4 4 4-6 4 6 4-4v9H4z"/><path d="M4 20h16"/></svg></span>
          <span class="stat__num">VIP</span><span class="stat__label">ระดับสมาชิก</span>
        </div>
      </section>

      <section class="account__panel">
        <h2>ตั้งค่ารับเงิน (พร้อมเพย์)</h2>
        <div class="pp-row">
          <input id="ppInput" class="pp-input" placeholder="เบอร์พร้อมเพย์ 10 หลัก หรือเลขบัตร 13 หลัก" inputmode="numeric" maxlength="13" />
          <button class="btn btn--primary btn--sm" id="ppSave" type="button">บันทึก</button>
        </div>
        <p class="pp-hint" id="ppMsg">ตั้งค่าเพื่อให้ผู้ซื้อโอนเงินให้คุณผ่าน QR พร้อมเพย์เมื่อสั่งซื้อสินค้าของคุณ</p>
      </section>

      <section class="account__panel">
        <h2>สินค้าของฉัน</h2>
        <div class="my-products" id="myProducts"></div>
      </section>

      <section class="account__panel">
        <h2>คำสั่งซื้อล่าสุด</h2>
        <div class="orders" id="orders"></div>
      </section>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script>
    (async function () {
      var s = await Auth.requireAuth("login.html");
      if (!s) return;
      document.getElementById("userName").textContent = s.name || "สมาชิก";
      document.getElementById("userEmail").textContent = s.email;
      var first = (s.name || "U").trim().charAt(0).toUpperCase();
      document.getElementById("avatar").textContent = first || "U";

      document.getElementById("logoutBtn").addEventListener("click", async function () {
        await Auth.logout();
        window.location.href = "index.html";
      });

      // โหลดคำสั่งซื้อจริง
      function esc(x){ return String(x == null ? "" : x).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
      try {
        var d = await (await fetch('/api/orders', { credentials: 'same-origin' })).json();
        var orders = d.orders || [];
        var statOrders = document.getElementById("statOrders");
        if (statOrders) statOrders.textContent = orders.length;
        var ob = document.getElementById("orders");
        if (!orders.length) {
          ob.innerHTML = '<div class="orders-empty">ยังไม่มีคำสั่งซื้อ — ไปช้อปที่หน้าร้านได้เลย</div>';
        } else {
          ob.innerHTML = orders.map(function (o) {
            var it = o.items[0] || {};
            var media = it.image
              ? '<img src="' + esc(it.image) + '" alt="">'
              : '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4V7z"/><path d="M3 7l9 4 9-4"/><path d="M12 11v10"/></svg>';
            var more = o.items.length > 1 ? ' และอีก ' + (o.items.length - 1) + ' รายการ' : '';
            var date = new Date(o.createdAt).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
            return '<div class="order"><span class="order__thumb">' + media + '</span>' +
              '<div class="order__info"><strong>' + esc(it.name || 'สินค้า') + more + '</strong>' +
              '<span>#' + esc(o.id) + ' • ' + date + '</span>' +
              (o.tracking ? '<span style="font-size:12.5px;color:var(--brand);font-weight:600">เลขพัสดุ: ' + esc(o.tracking) + '</span>' : '') +
              '</div>' +
              '<span class="order__price">฿' + o.total + '</span>' +
              '<span class="badge-status is-ship">' + esc(o.status || 'รอดำเนินการ') + '</span></div>';
          }).join("");
        }
      } catch (e) {}

      // ตั้งค่าพร้อมเพย์
      var ppInput = document.getElementById("ppInput");
      var ppMsg = document.getElementById("ppMsg");
      ppInput.addEventListener("input", function () { this.value = this.value.replace(/[^0-9]/g, ""); });
      try { var pd = await (await fetch('/api/profile', { credentials: 'same-origin' })).json(); if (pd.promptpay) ppInput.value = pd.promptpay; } catch (e) {}
      document.getElementById("ppSave").addEventListener("click", function () {
        fetch('/api/profile', { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin", body: JSON.stringify({ promptpay: ppInput.value }) })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) { ppMsg.textContent = res.ok ? "บันทึกพร้อมเพย์แล้ว" : (res.d.error || "บันทึกไม่สำเร็จ"); ppMsg.style.color = res.ok ? "#16b364" : "#e5484d"; });
      });

      // ----- สินค้าของฉัน + เปลี่ยนสถานะ (ว่าง / จองแล้ว / ขายแล้ว) -----
      var STATUS_LABELS = { available: "ว่าง", reserved: "จองแล้ว", sold: "ขายแล้ว" };
      var BOXICON = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width:26px;height:26px;color:var(--brand)"><path d="M3 7l9-4 9 4v10l-9 4-9-4V7z"/><path d="M3 7l9 4 9-4"/><path d="M12 11v10"/></svg>';
      var myBox = document.getElementById("myProducts");
      function statusOptions(cur){
        return ["available", "reserved", "sold"].map(function (s) {
          return '<option value="' + s + '"' + (s === cur ? ' selected' : '') + '>' + STATUS_LABELS[s] + '</option>';
        }).join("");
      }
      function loadMyProducts(){
        fetch('/api/products', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (d) {
          var mine = (d.products || []).filter(function (p) { return p.mine; });
          if (!mine.length) { myBox.innerHTML = '<div class="orders-empty">ยังไม่มีสินค้าที่ลงขาย — ไปลงขายที่หน้าร้านได้เลย</div>'; return; }
          myBox.innerHTML = mine.map(function (p) {
            var st = (p.status === "reserved" || p.status === "sold") ? p.status : "available";
            var media = p.image ? '<img src="' + esc(p.image) + '" alt="">' : BOXICON;
            return '<div class="my-product">' +
              '<span class="my-product__thumb">' + media + '</span>' +
              '<div class="my-product__info"><strong>' + esc(p.name) + '</strong>' +
                '<span>฿' + p.price + ' · <span class="my-product__st my-product__st--' + st + '">' + esc(STATUS_LABELS[st]) + '</span></span></div>' +
              '<select class="my-status" data-id="' + esc(p.id) + '">' + statusOptions(st) + '</select>' +
              '</div>';
          }).join("");
          myBox.querySelectorAll(".my-status").forEach(function (sel) {
            // กันเมาส์วีลเลื่อนเปลี่ยนค่า select ที่โฟกัสอยู่โดยไม่ตั้งใจ
            sel.addEventListener("wheel", function () { if (document.activeElement === sel) sel.blur(); });
            sel.addEventListener("change", function () {
              var id = sel.getAttribute("data-id");
              fetch('/api/products/' + encodeURIComponent(id) + '/status', { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin", body: JSON.stringify({ status: sel.value }) })
                .then(function (r) { return r.json().then(function (dd) { return { ok: r.ok, d: dd }; }); })
                .then(function (res) {
                  if (!res.ok) { alert(res.d.error || "เปลี่ยนสถานะไม่สำเร็จ"); loadMyProducts(); return; }
                  // อัปเดตป้ายทันที ไม่รีเฟรชทั้งหน้า (สถานะ server ตรวจแล้ว = 1 ใน 3 ค่า)
                  var st2 = res.d.status;
                  var lab = sel.closest(".my-product").querySelector(".my-product__st");
                  lab.textContent = STATUS_LABELS[st2] || st2;
                  lab.className = "my-product__st my-product__st--" + st2;
                });
            });
          });
        }).catch(function () { myBox.innerHTML = '<div class="orders-empty">โหลดสินค้าไม่สำเร็จ</div>'; });
      }
      loadMyProducts();
    })();
  </script>
</body>
</html>
