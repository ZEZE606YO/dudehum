<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>แผงแอดมิน — DUDEHUM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .admin-body { background: var(--bg-tint); min-height: 100vh; }
    /* ให้ attribute hidden มีผลจริง — กันโดน .admin/.admin-denied/.badge ที่ตั้ง display ทับ */
    [hidden] { display: none !important; }

    /* Access denied */
    .admin-denied { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; }
    .admin-denied__box { max-width: 380px; }
    .admin-denied h1 { font-size: 22px; margin-bottom: 8px; }
    .admin-denied p { color: var(--text-soft); margin-bottom: 20px; }

    /* Shell */
    .admin { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
    .admin__side {
      background: var(--navy); color: #fff; padding: 20px 14px;
      display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh;
    }
    .admin__brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
    .admin__brand img { height: 30px; }
    .admin__brand b { font-family: var(--font-display); font-weight: 800; font-size: 15px; }
    .admin__nav { display: flex; flex-direction: column; gap: 3px; }
    .admin__navbtn {
      display: flex; align-items: center; gap: 11px; width: 100%;
      background: none; border: 0; color: #c9d3e8; font: inherit; font-weight: 600;
      padding: 11px 12px; border-radius: 11px; cursor: pointer; text-align: left; position: relative;
    }
    .admin__navbtn .icon { width: 19px; height: 19px; flex: none; }
    .admin__navbtn:hover { background: rgba(255,255,255,.08); color: #fff; }
    .admin__navbtn.active { background: var(--brand); color: #fff; }
    .admin__navbadge {
      margin-left: auto; background: var(--brand); color: #fff; font-size: 11px; font-weight: 800;
      min-width: 19px; height: 19px; border-radius: 999px; display: grid; place-items: center; padding: 0 5px;
    }
    .admin__navbtn.active .admin__navbadge { background: #fff; color: var(--brand); }
    .admin__side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 3px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.12); }

    /* Main */
    .admin__main { padding: 26px 30px 60px; min-width: 0; }
    .admin__top { margin-bottom: 20px; }
    .admin__top h1 { font-size: 24px; }
    .admin__top p { color: var(--text-soft); font-size: 14px; margin-top: 2px; }

    /* Stat cards */
    .a-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .a-stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow-sm); }
    .a-stat__label { color: var(--text-soft); font-size: 13px; display: flex; align-items: center; gap: 7px; }
    .a-stat__label .icon { width: 16px; height: 16px; color: var(--brand); }
    .a-stat__num { font-family: var(--font-display); font-weight: 800; font-size: 26px; margin-top: 6px; }

    /* Card + table */
    .a-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; margin-bottom: 20px; }
    .a-card__head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .a-card__head h2 { font-size: 16px; }
    .a-search { margin-left: auto; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 999px; padding: 7px 14px; background: var(--bg); }
    .a-search input { border: 0; outline: 0; font: inherit; background: none; color: var(--text); width: 200px; }
    .a-search .icon { width: 16px; height: 16px; color: var(--text-soft); }
    .a-tablewrap { overflow-x: auto; }
    table.a-tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
    .a-tbl th { text-align: left; padding: 11px 16px; color: var(--text-soft); font-weight: 600; font-size: 12.5px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .a-tbl td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .a-tbl tr:last-child td { border-bottom: 0; }
    .a-tbl tr.click { cursor: pointer; }
    .a-tbl tr.click:hover td { background: var(--bg-tint); }
    .a-who { display: flex; align-items: center; gap: 10px; }
    .a-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--brand-grad); color: #fff; display: grid; place-items: center; font-weight: 800; font-family: var(--font-display); flex: none; font-size: 14px; }
    .a-sub { color: var(--text-soft); font-size: 12.5px; }
    .a-empty { padding: 44px 20px; text-align: center; color: var(--text-soft); }

    /* Pills / badges */
    .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
    .pill--ok { background: color-mix(in srgb, #16b364 14%, transparent); color: #0f9d58; }
    .pill--wait { background: color-mix(in srgb, #f7b500 18%, transparent); color: #b07a00; }
    .pill--off { background: color-mix(in srgb, #e5484d 14%, transparent); color: #d13438; }
    .pill--muted { background: var(--bg-tint); color: var(--text-soft); }
    .pill--brand { background: color-mix(in srgb, var(--brand) 14%, transparent); color: var(--brand); }

    /* Mini buttons */
    .a-btn { font: inherit; font-weight: 600; font-size: 13px; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; white-space: nowrap; }
    .a-btn:hover { border-color: var(--brand); color: var(--brand); }
    .a-btn--danger { border-color: color-mix(in srgb, #e5484d 40%, transparent); color: #d13438; }
    .a-btn--danger:hover { background: #e5484d; color: #fff; border-color: #e5484d; }
    .a-btn--solid { background: var(--brand-grad); color: #fff; border-color: transparent; }
    .a-btn--solid:hover { color: #fff; opacity: .92; }
    .a-thumb { width: 42px; height: 42px; border-radius: 9px; overflow: hidden; background: var(--bg-tint); display: grid; place-items: center; flex: none; }
    .a-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .a-thumb .icon { width: 22px; height: 22px; color: var(--text-soft); }
    .track-cell { display: inline-flex; gap: 6px; align-items: center; }
    .track-inp { border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; width: 128px; outline: 0; background: var(--bg); color: var(--text); }
    .track-inp:focus { border-color: var(--brand); }

    /* Modal */
    .admin-modal { position: fixed; inset: 0; background: rgba(16,26,50,.5); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 200; }
    .admin-modal.open { display: flex; }
    .admin-modal__box { background: var(--surface); border-radius: var(--radius-lg); width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; box-shadow: var(--shadow); }
    .m-head { display: flex; align-items: flex-start; gap: 12px; padding: 20px 22px 14px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); }
    .m-head .a-avatar { width: 46px; height: 46px; font-size: 18px; }
    .m-head h2 { font-size: 18px; }
    .m-close { margin-left: auto; background: none; border: 0; cursor: pointer; color: var(--text-soft); padding: 4px; }
    .m-close .icon { width: 22px; height: 22px; }
    .m-body { padding: 18px 22px 22px; }
    .m-sec { margin-bottom: 18px; }
    .m-sec h3 { font-size: 13px; color: var(--text-soft); text-transform: none; margin-bottom: 8px; font-family: var(--font-sans); font-weight: 700; }
    .m-list { display: flex; flex-direction: column; gap: 8px; }
    .m-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--bg-tint); border-radius: 10px; font-size: 13.5px; }
    .m-row .a-sub { margin-left: auto; }
    .m-kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
    .m-kv dt { color: var(--text-soft); }
    .m-actions { display: flex; gap: 10px; padding-top: 6px; border-top: 1px solid var(--border); margin-top: 6px; padding-top: 16px; }

    /* Report → chat-style view */
    .rp-topic { align-self: center; background: color-mix(in srgb, var(--brand) 10%, transparent); color: var(--brand); font-size: 12px; padding: 4px 12px; border-radius: 999px; margin: 0 auto 4px; }
    .rp-chat { display: flex; flex-direction: column; gap: 8px; background: var(--bg-tint); border: 1px solid var(--border); border-radius: 14px; padding: 14px; max-height: 52vh; overflow-y: auto; }
    .rp-line { display: flex; }
    .rp-line--r { justify-content: flex-end; }
    .rp-bubble { max-width: 78%; padding: 8px 12px; border-radius: 14px; border-bottom-left-radius: 5px; font-size: 14px; line-height: 1.5; background: var(--surface); border: 1px solid var(--border); word-wrap: break-word; white-space: pre-wrap; }
    .rp-line--r .rp-bubble { background: var(--brand-grad); color: #fff; border-color: transparent; border-bottom-left-radius: 14px; border-bottom-right-radius: 5px; }
    .rp-name { display: block; font-size: 11px; font-weight: 700; margin-bottom: 2px; color: var(--brand); }
    .rp-line--r .rp-name { color: rgba(255,255,255,.9); }
    .rp-time { display: block; font-size: 10px; opacity: .6; margin-top: 3px; text-align: right; }

    /* Toast */
    .admin-toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--navy); color: #fff; padding: 11px 20px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: .25s; z-index: 300; }
    .admin-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 720px) {
      .admin { grid-template-columns: 1fr; }
      .admin__side { flex-direction: row; height: auto; position: static; overflow-x: auto; align-items: center; gap: 4px; padding: 10px; }
      .admin__brand { display: none; }
      .admin__nav { flex-direction: row; }
      .admin__navbtn span.lbl { display: none; }
      .admin__side-foot { margin: 0 0 0 auto; flex-direction: row; border: 0; padding: 0; }
      .admin__main { padding: 18px 16px 50px; }
    }
  </style>
</head>
<body class="admin-body">
  <!-- ไม่มีสิทธิ์ -->
  <div class="admin-denied" id="denied" hidden>
    <div class="admin-denied__box">
      <h1>เฉพาะแอดมินเท่านั้น</h1>
      <p>หน้านี้สงวนไว้สำหรับผู้ดูแลระบบ DUDEHUM</p>
      <a href="index.html" class="btn btn--primary">กลับหน้าแรก</a>
    </div>
  </div>

  <!-- แผงแอดมิน -->
  <div class="admin" id="app" hidden>
    <aside class="admin__side">
      <div class="admin__brand">
        <img src="assets/logo-white.svg" alt="DUDEHUM" />
        <b>Admin</b>
      </div>
      <nav class="admin__nav" id="nav">
        <button class="admin__navbtn active" data-tab="overview">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="11" width="7" height="10" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/></svg>
          <span class="lbl">ภาพรวม</span>
        </button>
        <button class="admin__navbtn" data-tab="users">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.5a3 3 0 0 1 0 5.6"/><path d="M17.5 20a5.5 5.5 0 0 0-3-4.9"/></svg>
          <span class="lbl">สมาชิก</span>
        </button>
        <button class="admin__navbtn" data-tab="orders">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4V7z"/><path d="M3 7l9 4 9-4"/><path d="M12 11v10"/></svg>
          <span class="lbl">ออเดอร์</span>
        </button>
        <button class="admin__navbtn" data-tab="products">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12.5l-7.5 7.5L4 11.5V4h7.5z"/><circle cx="9" cy="9" r="1.4"/></svg>
          <span class="lbl">สินค้า</span>
        </button>
        <button class="admin__navbtn" data-tab="reports">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4h9l-1 3h6l-1.5 4L19 15H6"/><path d="M5 4v17"/></svg>
          <span class="lbl">รายงาน</span>
          <span class="admin__navbadge" id="repBadge" hidden>0</span>
        </button>
      </nav>
      <div class="admin__side-foot">
        <a href="shop.html" class="admin__navbtn">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 12.5a1 1 0 0 1-1 .9H8a1 1 0 0 1-1-.9L6 7z"/><path d="M9 7V6a3 3 0 0 1 6 0v1"/></svg>
          <span class="lbl">กลับหน้าร้าน</span>
        </a>
        <button class="admin__navbtn" id="logoutBtn">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h9"/></svg>
          <span class="lbl">ออกจากระบบ</span>
        </button>
      </div>
    </aside>

    <main class="admin__main">
      <div class="admin__top">
        <h1 id="pageTitle">ภาพรวม</h1>
        <p id="pageSub">สรุปข้อมูลร้าน DUDEHUM</p>
      </div>
      <section id="view"><div class="a-empty">กำลังโหลด...</div></section>
    </main>
  </div>

  <!-- modal (รายละเอียดสมาชิก / รายงาน) -->
  <div class="admin-modal" id="modal"><div class="admin-modal__box" id="modalBox"></div></div>
  <div class="admin-toast" id="toast" role="status"></div>

  <script src="js/auth.js"></script>
  <script>
    (async function () {
      var me = await Auth.me();
      if (!me) { window.location.replace("login.html"); return; }
      if (!me.isAdmin) { document.getElementById("denied").hidden = false; return; }
      document.getElementById("app").hidden = false;

      // ---------- helpers ----------
      function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
      function initial(n){ return (String(n||"?").trim().charAt(0)||"?").toUpperCase(); }
      function fmtDate(ts){ return ts ? new Date(ts).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'}) : '-'; }
      function fmtDT(ts){ return ts ? new Date(ts).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '-'; }
      function baht(n){ return '฿' + Number(n||0).toLocaleString('th-TH'); }
      var BOX = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4V7z"/><path d="M3 7l9 4 9-4"/></svg>';
      function thumb(p){ return '<span class="a-thumb">' + (p.image ? '<img src="'+esc(p.image)+'" alt="">' : BOX) + '</span>'; }

      async function api(path, method, body){
        var res = await fetch(path, { method: method||"GET", headers: body?{"Content-Type":"application/json"}:undefined, credentials:"same-origin", body: body?JSON.stringify(body):undefined });
        var d = {}; try { d = await res.json(); } catch(e){}
        if (!res.ok) throw new Error(d.error || "เกิดข้อผิดพลาด");
        return d;
      }
      var toastEl = document.getElementById("toast"), toastT = null;
      function toast(msg){ toastEl.textContent = msg; toastEl.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove("show"); }, 2400); }

      var modal = document.getElementById("modal"), modalBox = document.getElementById("modalBox");
      function openModal(html){ modalBox.innerHTML = html; modal.classList.add("open"); }
      function closeModal(){ modal.classList.remove("open"); }
      modal.addEventListener("click", function(e){ if (e.target === modal) closeModal(); });

      function statusPill(o){
        if (o.status === "ยกเลิก") return '<span class="pill pill--off">ยกเลิก</span>';
        if (o.status === "จัดส่งสำเร็จ") return '<span class="pill pill--ok">จัดส่งสำเร็จ</span>';
        if (o.status === "กำลังจัดส่ง") return '<span class="pill pill--brand">กำลังจัดส่ง</span>';
        if (o.paid || o.status === "ชำระเงินแล้ว") return '<span class="pill pill--ok">ชำระเงินแล้ว</span>';
        return '<span class="pill pill--wait">รอชำระเงิน</span>';
      }

      // ---------- tabs ----------
      var view = document.getElementById("view");
      var TITLES = {
        overview: ["ภาพรวม", "สรุปข้อมูลร้าน DUDEHUM"],
        users: ["จัดการสมาชิก", "ดู ค้นหา แบน และลบบัญชีสมาชิก"],
        orders: ["จัดการออเดอร์", "ดูคำสั่งซื้อทั้งหมดและเปลี่ยนสถานะ"],
        products: ["จัดการสินค้า", "ดูและลบสินค้าของทุกร้าน"],
        reports: ["รายงานปัญหา", "เห็นเฉพาะห้องแชทที่ถูกผู้ใช้กดรายงาน"]
      };
      var RENDER = { overview: renderOverview, users: renderUsers, orders: renderOrders, products: renderProducts, reports: renderReports };
      function switchTab(tab){
        document.querySelectorAll(".admin__navbtn[data-tab]").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-tab") === tab); });
        document.getElementById("pageTitle").textContent = TITLES[tab][0];
        document.getElementById("pageSub").textContent = TITLES[tab][1];
        view.innerHTML = '<div class="a-empty">กำลังโหลด...</div>';
        RENDER[tab]().catch(function(e){ view.innerHTML = '<div class="a-empty">โหลดไม่สำเร็จ: ' + esc(e.message) + '</div>'; });
      }
      document.querySelectorAll(".admin__navbtn[data-tab]").forEach(function(b){
        b.addEventListener("click", function(){ switchTab(b.getAttribute("data-tab")); });
      });
      document.getElementById("logoutBtn").addEventListener("click", async function(){ await Auth.logout(); window.location.href = "index.html"; });

      // ---------- 1) Overview ----------
      async function renderOverview(){
        var d = await api("/api/admin/stats");
        updateRepBadge(d.openReports);
        var cards = [
          ["สมาชิกทั้งหมด", d.users, '<path d="M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M4 19a5 5 0 0 1 10 0"/>'],
          ["สินค้าในระบบ", d.products, '<path d="M20 12.5l-7.5 7.5L4 11.5V4h7.5z"/>'],
          ["ออเดอร์ทั้งหมด", d.orders, '<path d="M3 7l9-4 9 4v10l-9 4-9-4V7z"/><path d="M3 7l9 4 9-4"/>'],
          ["จ่ายเงินแล้ว", d.paidOrders, '<path d="M4 12l5 5L20 6"/>'],
          ["ยอดขายรวม", baht(d.revenue), '<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4"/>'],
          ["รายงานค้าง", d.openReports, '<path d="M5 21V4h9l-1 3h6l-1.5 4L19 15H6"/><path d="M5 4v17"/>']
        ];
        var html = '<div class="a-stats">' + cards.map(function(c){
          return '<div class="a-stat"><div class="a-stat__label"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">'+c[2]+'</svg>'+c[0]+'</div><div class="a-stat__num">'+ (typeof c[1]==='number'? c[1].toLocaleString('th-TH') : c[1]) +'</div></div>';
        }).join("") + '</div>';
        html += '<div class="a-card"><div class="a-card__head"><h2>ออเดอร์ล่าสุด</h2></div><div class="a-tablewrap">';
        if (!d.recentOrders.length) html += '<div class="a-empty">ยังไม่มีออเดอร์</div>';
        else html += '<table class="a-tbl"><thead><tr><th>รหัส</th><th>ผู้ซื้อ</th><th>ยอด</th><th>สถานะ</th><th>วันที่</th></tr></thead><tbody>' +
          d.recentOrders.map(function(o){ return '<tr><td>#'+esc(o.id)+'</td><td>'+esc(o.buyerName)+'</td><td>'+baht(o.total)+'</td><td>'+statusPill(o)+'</td><td class="a-sub">'+fmtDT(o.createdAt)+'</td></tr>'; }).join("") +
          '</tbody></table>';
        html += '</div></div>';
        view.innerHTML = html;
      }

      // ---------- 2) Users ----------
      var allUsers = [];
      async function renderUsers(){
        var d = await api("/api/admin/users");
        allUsers = d.users;
        view.innerHTML =
          '<div class="a-card"><div class="a-card__head"><h2>สมาชิกทั้งหมด (' + allUsers.length + ')</h2>' +
          '<span class="a-search"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg>' +
          '<input id="userSearch" placeholder="ค้นหาชื่อหรืออีเมล" /></span></div>' +
          '<div class="a-tablewrap" id="userTblWrap"></div></div>';
        drawUsers(allUsers);
        document.getElementById("userSearch").addEventListener("input", function(){
          var q = this.value.trim().toLowerCase();
          drawUsers(allUsers.filter(function(u){ return u.name.toLowerCase().indexOf(q) >= 0 || u.email.toLowerCase().indexOf(q) >= 0; }));
        });
      }
      function drawUsers(list){
        var wrap = document.getElementById("userTblWrap");
        if (!list.length) { wrap.innerHTML = '<div class="a-empty">ไม่พบสมาชิก</div>'; return; }
        wrap.innerHTML = '<table class="a-tbl"><thead><tr><th>สมาชิก</th><th>สมัครเมื่อ</th><th>ออเดอร์</th><th>สินค้า</th><th>สถานะ</th></tr></thead><tbody>' +
          list.map(function(u){
            var badge = u.isAdmin ? '<span class="pill pill--brand">แอดมิน</span>' : (u.banned ? '<span class="pill pill--off">ถูกระงับ</span>' : '<span class="pill pill--ok">ปกติ</span>');
            return '<tr class="click" data-email="'+esc(u.email)+'">' +
              '<td><div class="a-who"><span class="a-avatar">'+initial(u.name)+'</span><div><div>'+esc(u.name)+'</div><div class="a-sub">'+esc(u.email)+'</div></div></div></td>' +
              '<td class="a-sub">'+fmtDate(u.createdAt)+'</td><td>'+u.orderCount+'</td><td>'+u.productCount+'</td><td>'+badge+'</td></tr>';
          }).join("") + '</tbody></table>';
        wrap.querySelectorAll("tr.click").forEach(function(tr){
          tr.addEventListener("click", function(){ openUser(tr.getAttribute("data-email")); });
        });
      }

      async function openUser(email){
        var d;
        try { d = await api("/api/admin/users/" + encodeURIComponent(email)); }
        catch(e){ toast(e.message); return; }
        var u = d.user;
        var prods = d.products.length ? d.products.map(function(p){ return '<div class="m-row">'+thumb(p)+'<div>'+esc(p.name)+'</div><span class="a-sub">'+baht(p.price)+'</span></div>'; }).join("")
          : '<div class="a-sub">— ไม่มีสินค้า</div>';
        var ords = d.orders.length ? d.orders.map(function(o){ return '<div class="m-row"><div>#'+esc(o.id)+'</div>'+statusPill(o)+'<span class="a-sub">'+baht(o.total)+' · '+fmtDate(o.createdAt)+'</span></div>'; }).join("")
          : '<div class="a-sub">— ยังไม่มีออเดอร์</div>';
        var chats = d.chats.length ? d.chats.map(function(c){ return '<div class="m-row"><div>คุยกับ '+esc(c.otherName)+'</div><span class="a-sub">'+c.count+' ข้อความ · '+fmtDate(c.lastAt)+'</span></div>'; }).join("")
          : '<div class="a-sub">— ไม่มีประวัติแชท</div>';
        var actions = u.isAdmin
          ? '<span class="a-sub">บัญชีแอดมิน — จัดการไม่ได้</span>'
          : '<button class="a-btn" id="mBan">'+(u.banned?"ปลดระงับ":"ระงับบัญชี")+'</button><button class="a-btn a-btn--danger" id="mDel">ลบบัญชีถาวร</button>';
        openModal(
          '<div class="m-head"><span class="a-avatar">'+initial(u.name)+'</span><div><h2>'+esc(u.name)+'</h2>' +
            '<div class="a-sub">'+esc(u.email)+'</div></div>' +
            '<button class="m-close" id="mClose"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
          '<div class="m-body">' +
            '<div class="m-sec"><dl class="m-kv">' +
              '<dt>สมัครเมื่อ</dt><dd>'+fmtDate(u.createdAt)+'</dd>' +
              '<dt>พร้อมเพย์</dt><dd>'+(u.promptpay?esc(u.promptpay):'<span class="a-sub">ยังไม่ตั้ง</span>')+'</dd>' +
              '<dt>สถานะ</dt><dd>'+(u.banned?'<span class="pill pill--off">ถูกระงับ</span>':'<span class="pill pill--ok">ปกติ</span>')+'</dd>' +
            '</dl></div>' +
            '<div class="m-sec"><h3>สินค้าที่ลงขาย ('+d.products.length+')</h3><div class="m-list">'+prods+'</div></div>' +
            '<div class="m-sec"><h3>ประวัติออเดอร์ ('+d.orders.length+')</h3><div class="m-list">'+ords+'</div></div>' +
            '<div class="m-sec"><h3>ประวัติแชท ('+d.chats.length+' ห้อง) — เห็นเฉพาะสรุป</h3><div class="m-list">'+chats+'</div></div>' +
            '<div class="m-actions">'+actions+'</div>' +
          '</div>'
        );
        document.getElementById("mClose").addEventListener("click", closeModal);
        var banBtn = document.getElementById("mBan");
        if (banBtn) banBtn.addEventListener("click", async function(){
          try { var r = await api("/api/admin/users/"+encodeURIComponent(email)+"/ban", "POST", {}); toast(r.banned?"ระงับบัญชีแล้ว":"ปลดระงับแล้ว"); closeModal(); renderUsers(); }
          catch(e){ toast(e.message); }
        });
        var delBtn = document.getElementById("mDel");
        if (delBtn) delBtn.addEventListener("click", async function(){
          if (!confirm("ลบบัญชี "+u.name+" ถาวร?\nสินค้าของเขาจะถูกลบด้วย (ออเดอร์เก็บไว้เป็นประวัติ)")) return;
          if (!confirm("ยืนยันอีกครั้ง — การลบนี้กู้คืนไม่ได้")) return;
          try { await api("/api/admin/users/"+encodeURIComponent(email), "DELETE"); toast("ลบบัญชีแล้ว"); closeModal(); renderUsers(); }
          catch(e){ toast(e.message); }
        });
      }

      // ---------- 3) Orders ----------
      async function renderOrders(){
        var d = await api("/api/admin/orders");
        var STATUSES = ["รอชำระเงิน","ชำระเงินแล้ว","กำลังจัดส่ง","จัดส่งสำเร็จ","ยกเลิก"];
        if (!d.orders.length) { view.innerHTML = '<div class="a-card"><div class="a-empty">ยังไม่มีออเดอร์</div></div>'; return; }
        view.innerHTML = '<div class="a-card"><div class="a-card__head"><h2>ออเดอร์ทั้งหมด ('+d.orders.length+')</h2></div><div class="a-tablewrap">' +
          '<table class="a-tbl"><thead><tr><th>รหัส</th><th>ผู้ซื้อ</th><th>สินค้า</th><th>ยอด</th><th>วันที่</th><th>สถานะ</th><th>เลขพัสดุ</th></tr></thead><tbody>' +
          d.orders.map(function(o){
            var first = (o.items && o.items[0]) || {};
            var more = o.items && o.items.length > 1 ? ' +'+(o.items.length-1) : '';
            var opts = STATUSES.map(function(s){ return '<option value="'+s+'"'+(o.status===s?' selected':'')+'>'+s+'</option>'; }).join("");
            return '<tr><td>#'+esc(o.id)+'</td><td>'+esc(o.buyerName)+'</td><td>'+esc(first.name||'-')+'<span class="a-sub">'+more+'</span></td>' +
              '<td>'+baht(o.total)+'</td><td class="a-sub">'+fmtDT(o.createdAt)+'</td>' +
              '<td><select class="a-btn ostatus" data-id="'+esc(o.id)+'" data-orig="'+esc(o.status)+'">'+opts+'</select></td>' +
              '<td><span class="track-cell"><input class="track-inp" data-id="'+esc(o.id)+'" value="'+esc(o.tracking||'')+'" placeholder="กรอกเลขพัสดุ" maxlength="60"><button class="a-btn track-save" data-id="'+esc(o.id)+'">บันทึก</button></span></td></tr>';
          }).join("") + '</tbody></table></div></div>';
        view.querySelectorAll(".ostatus").forEach(function(sel){
          // กันเมาส์วีลเปลี่ยนค่า select ที่โฟกัสอยู่โดยไม่ตั้งใจ (พอ scroll จะปล่อยโฟกัสให้หน้าเลื่อนแทน)
          sel.addEventListener("wheel", function(){ if (document.activeElement === sel) sel.blur(); });
          sel.addEventListener("change", async function(){
            var id = sel.getAttribute("data-id");
            var orig = sel.getAttribute("data-orig");
            var next = sel.value;
            if (next === orig) return;
            // ยืนยันก่อนบันทึก — กันเผลอเปลี่ยน (เช่นโดนวีล/คีย์บอร์ด)
            if (!confirm('เปลี่ยนสถานะออเดอร์ #' + id + '\nจาก "' + orig + '"  →  "' + next + '" ?')) {
              sel.value = orig;   // ยกเลิก: คืนค่าเดิม
              return;
            }
            try {
              await api("/api/admin/orders/"+encodeURIComponent(id)+"/status", "POST", { status: next });
              sel.setAttribute("data-orig", next);
              toast('อัปเดตออเดอร์ #' + id + ' เป็น "' + next + '"');
            } catch(e) {
              toast(e.message);
              sel.value = orig;   // บันทึกไม่สำเร็จ: คืนค่าเดิม
            }
          });
        });
        // บันทึกเลขพัสดุ
        view.querySelectorAll(".track-save").forEach(function(btn){
          btn.addEventListener("click", async function(){
            var id = btn.getAttribute("data-id");
            var inp = btn.parentNode.querySelector(".track-inp");
            try {
              var r = await api("/api/admin/orders/"+encodeURIComponent(id)+"/tracking", "POST", { tracking: inp.value.trim() });
              toast(r.tracking ? ('บันทึกเลขพัสดุ #'+id+' แล้ว') : ('ล้างเลขพัสดุ #'+id+' แล้ว'));
            } catch(e){ toast(e.message); }
          });
        });
      }

      // ---------- 4) Products ----------
      async function renderProducts(){
        var d = await api("/api/admin/products");
        if (!d.products.length) { view.innerHTML = '<div class="a-card"><div class="a-empty">ยังไม่มีสินค้าในระบบ</div></div>'; return; }
        view.innerHTML = '<div class="a-card"><div class="a-card__head"><h2>สินค้าทั้งหมด ('+d.products.length+')</h2></div><div class="a-tablewrap">' +
          '<table class="a-tbl"><thead><tr><th>สินค้า</th><th>ราคา</th><th>ผู้ขาย</th><th>ลงเมื่อ</th><th></th></tr></thead><tbody>' +
          d.products.map(function(p){
            return '<tr><td><div class="a-who">'+thumb(p)+'<div>'+esc(p.name)+'</div></div></td>' +
              '<td>'+baht(p.price)+(p.oldPrice?' <span class="a-sub"><s>'+baht(p.oldPrice)+'</s></span>':'')+'</td>' +
              '<td class="a-sub">'+esc(p.ownerName||'-')+'</td><td class="a-sub">'+fmtDate(p.createdAt)+'</td>' +
              '<td><button class="a-btn a-btn--danger pdel" data-id="'+esc(p.id)+'">ลบ</button></td></tr>';
          }).join("") + '</tbody></table></div></div>';
        view.querySelectorAll(".pdel").forEach(function(btn){
          btn.addEventListener("click", async function(){
            if (!confirm("ลบสินค้านี้ออกจากระบบ?")) return;
            try { await api("/api/admin/products/"+encodeURIComponent(btn.getAttribute("data-id")), "DELETE"); toast("ลบสินค้าแล้ว"); renderProducts(); }
            catch(e){ toast(e.message); }
          });
        });
      }

      // ---------- 5) Reports ----------
      async function renderReports(){
        var d = await api("/api/admin/reports");
        updateRepBadge(d.reports.filter(function(r){ return !r.resolved; }).length);
        if (!d.reports.length) { view.innerHTML = '<div class="a-card"><div class="a-empty">ยังไม่มีรายงานปัญหา</div></div>'; return; }
        view.innerHTML = '<div class="a-card"><div class="a-card__head"><h2>รายงานปัญหา ('+d.reports.length+')</h2></div><div class="a-tablewrap">' +
          '<table class="a-tbl"><thead><tr><th>ผู้รายงาน</th><th>รายงาน</th><th>หมวด</th><th>เมื่อ</th><th></th></tr></thead><tbody>' +
          d.reports.map(function(r){
            var st = r.resolved ? '<span class="pill pill--muted">ปิดแล้ว</span>' : '<span class="pill pill--wait">รอตรวจ</span>';
            return '<tr><td>'+esc(r.reporterName)+' '+st+'</td><td class="a-sub">ต่อ '+esc(r.againstName)+(r.detail?'<br>“'+esc(r.detail)+'”':'')+'</td>' +
              '<td><span class="pill pill--off">'+esc(r.reason)+'</span></td><td class="a-sub">'+fmtDT(r.createdAt)+'</td>' +
              '<td><button class="a-btn ropen" data-conv="'+esc(r.convId)+'" data-id="'+esc(r.id)+'" data-resolved="'+(r.resolved?'1':'')+'" data-reporter="'+esc(r.reporterEmail)+'" data-rname="'+esc(r.reporterName)+'" data-aname="'+esc(r.againstName)+'">เปิดอ่าน</button></td></tr>';
          }).join("") + '</tbody></table></div></div>';
        view.querySelectorAll(".ropen").forEach(function(btn){
          btn.addEventListener("click", function(){ openReport(btn.getAttribute("data-conv"), btn.getAttribute("data-id"), btn.getAttribute("data-resolved"), btn.getAttribute("data-reporter"), btn.getAttribute("data-rname"), btn.getAttribute("data-aname")); });
        });
      }

      async function openReport(convId, reportId, resolved, reporterEmail, reporterName, againstName){
        var d;
        try { d = await api("/api/admin/reports/"+encodeURIComponent(convId)+"/messages"); }
        catch(e){ toast(e.message); return; }
        var prod = (d.messages.find(function(m){ return m.productName; }) || {}).productName;
        var note = prod ? '<div class="rp-topic">กำลังคุยเรื่อง: ' + esc(prod) + '</div>' : '';
        var chat = d.messages.length
          ? '<div class="rp-chat">' + note + d.messages.map(function(m){
              var right = m.fromEmail === reporterEmail;   // ผู้รายงานอยู่ฝั่งขวา
              return '<div class="rp-line ' + (right ? 'rp-line--r' : '') + '">' +
                '<div class="rp-bubble"><span class="rp-name">' + esc(m.fromName) + '</span>' + esc(m.text) +
                '<span class="rp-time">' + fmtDT(m.createdAt) + '</span></div></div>';
            }).join("") + '</div>'
          : '<div class="a-sub">ไม่มีข้อความในห้องนี้</div>';
        openModal(
          '<div class="m-head"><div><h2>บทสนทนาที่ถูกรายงาน</h2>' +
            '<div class="a-sub">' + esc(reporterName || "ผู้รายงาน") + ' (ผู้รายงาน) ↔ ' + esc(againstName || "ผู้ถูกรายงาน") + '</div></div>' +
            '<button class="m-close" id="mClose"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
          '<div class="m-body">' + chat +
            (resolved ? '<div class="a-sub" style="margin-top:12px">รายงานนี้ปิดแล้ว</div>' : '<div class="m-actions"><button class="a-btn a-btn--solid" id="mResolve">ทำเครื่องหมายว่าจัดการแล้ว</button></div>') +
          '</div>'
        );
        document.getElementById("mClose").addEventListener("click", closeModal);
        var rb = document.getElementById("mResolve");
        if (rb) rb.addEventListener("click", async function(){
          try { await api("/api/admin/reports/"+encodeURIComponent(reportId)+"/resolve", "POST", {}); toast("ปิดเคสแล้ว"); closeModal(); renderReports(); }
          catch(e){ toast(e.message); }
        });
      }

      function updateRepBadge(n){
        var b = document.getElementById("repBadge");
        if (n > 0) { b.textContent = n; b.hidden = false; } else { b.hidden = true; }
      }

      // เริ่มที่ภาพรวม
      switchTab("overview");
    })();
  </script>
</body>
</html>
