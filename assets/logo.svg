<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 96" role="img" aria-label="DH Group">
  <!-- hexagon -->
  <polygon points="48,8 82.6,28 82.6,68 48,88 13.4,68 13.4,28"
           fill="none" stroke="#16264f" stroke-width="7" stroke-linejoin="round"/>
  <!-- growth arrow -->
  <path d="M40 66 L74 33" fill="none" stroke="#f26a21" stroke-width="6.5"
        stroke-linecap="round"/>
  <path d="M63 31 L76 30.5 L75 44" fill="none" stroke="#f26a21" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- DH letters -->
  <text x="47" y="64" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="41"
        font-style="italic">
    <tspan fill="#f26a21">D</tspan><tspan fill="#16264f">H</tspan>
  </text>
  <!-- wordmark -->
  <text x="103" y="56" font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="37" fill="#16264f" letter-spacing="-0.5">DH Group</text>
  <rect x="105" y="66" width="180" height="7" rx="3.5" fill="#f26a21"/>
</svg>
